name: SnapCase Contract Tests

on:
  pull_request:
    paths:
      - 'scripts/snapcase/**'
      - 'supabase/functions/snapcase-data-ingest/**'
      - 'supabase/config.toml'
      - '.github/workflows/snapcase-contract-tests.yml'
      - '.github/workflows/snapcase-sync.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/snapcase/**'
      - 'supabase/functions/snapcase-data-ingest/**'
      - 'supabase/config.toml'
      - '.github/workflows/snapcase-contract-tests.yml'
      - '.github/workflows/snapcase-sync.yml'

permissions:
  contents: read

concurrency:
  group: snapcase-contract-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.3
      - name: Test SnapCase extractor contract
        run: node --test scripts/snapcase/*.test.mjs
      - name: Test SnapCase ingest boundary
        run: deno test --no-lock supabase/functions/snapcase-data-ingest/handler.test.ts
