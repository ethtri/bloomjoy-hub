name: Refund Production Drift

on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refund-production-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-drift:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production-readonly
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ygbzkgxktzqsiygjlqyg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Validate least-privilege Supabase credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_EDGE_FUNCTIONS_READ_TOKEN }}
        run: npm run refunds:validate-drift-credential
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.95.4
      - name: Check production drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_EDGE_FUNCTIONS_READ_TOKEN }}
        run: npm run refunds:release:check-production -- --project-ref "$SUPABASE_PROJECT_REF" --fetch-reviewed-source
