name: Manager Payroll UAT

on:
  pull_request:
    paths:
      - 'src/pages/portal/TimeReview.tsx'
      - 'src/pages/admin/Payouts.tsx'
      - 'src/lib/operatorPayouts.ts'
      - 'scripts/validate-manager-time-pay-reports-uat.mjs'
      - '.github/workflows/manager-payroll-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise mocked manager recovery flows
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key
        run: |
          npm run dev:uat > /tmp/manager-payroll-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then break; fi
            sleep 1
          done
          npm run operator-payouts:validate-manager-reports-uat
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-payroll-uat
          path: output/playwright/manager-time-pay-reports
          if-no-files-found: ignore
