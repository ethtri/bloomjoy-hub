name: SnapCase Sync
run-name: >-
  SnapCase Sync | event=${{ github.event_name }} | mode=${{ inputs.mode || 'scheduled-live' }} | start=${{ inputs.date_start || 'routine' }} | end=${{ inputs.date_end || 'routine' }}

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fixture dry run is safe; live modes also require the disabled environment flag'
        required: true
        default: fixture-dry-run
        type: choice
        options:
          - fixture-dry-run
          - live-ingest
          - history-backfill
      date_start:
        description: 'Inclusive YYYY-MM-DD start; required with date_end for history backfill'
        required: false
        type: string
      date_end:
        description: 'Inclusive YYYY-MM-DD end; required with date_start for history backfill'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: snapcase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'history-backfill' && 360 || 20 }}
    env:
      SNAPCASE_SYNC_ENABLED: ${{ vars.SNAPCASE_SYNC_ENABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Validate manual date range
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'fixture-dry-run'
        env:
          DATE_START: ${{ inputs.date_start || '' }}
          DATE_END: ${{ inputs.date_end || '' }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ -n "$DATE_START" || -n "$DATE_END" ]]; then
            if [[ -z "$DATE_START" || -z "$DATE_END" ]]; then
              echo "date_start and date_end must be provided together." >&2
              exit 1
            fi
          elif [[ "$MODE" == "history-backfill" ]]; then
            echo "history-backfill requires date_start and date_end." >&2
            exit 1
          fi
      - name: Keep scheduled sync disabled until production activation
        if: github.event_name == 'schedule' && env.SNAPCASE_SYNC_ENABLED != 'true'
        run: echo "SnapCase sync is disabled."
      - name: Run synthetic fixture validation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fixture-dry-run'
        run: node scripts/snapcase/sync-snapcase.mjs
      - name: Run enabled private staging sync
        if: >-
          (github.event_name == 'schedule' && env.SNAPCASE_SYNC_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-ingest' && env.SNAPCASE_SYNC_ENABLED == 'true')
        env:
          KEXIAOZHAN_REPORTING_USERNAME: ${{ secrets.KEXIAOZHAN_REPORTING_USERNAME }}
          KEXIAOZHAN_REPORTING_PASSWORD: ${{ secrets.KEXIAOZHAN_REPORTING_PASSWORD }}
          SNAPCASE_ACCOUNT_KEY: ${{ secrets.SNAPCASE_ACCOUNT_KEY }}
          REPORTING_ROW_HASH_SALT: ${{ secrets.REPORTING_ROW_HASH_SALT }}
          SNAPCASE_INGEST_URL: ${{ secrets.SNAPCASE_INGEST_URL }}
          REPORTING_INGEST_TOKEN: ${{ secrets.REPORTING_INGEST_TOKEN }}
          DATE_START: ${{ inputs.date_start || '' }}
          DATE_END: ${{ inputs.date_end || '' }}
        run: |
          args=(--live-provider --ingest)
          if [[ -n "$DATE_START" ]]; then
            args+=(--date-start "$DATE_START" --date-end "$DATE_END")
          fi
          node scripts/snapcase/sync-snapcase.mjs "${args[@]}"
      - name: Run enabled historical backfill
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.mode == 'history-backfill' &&
          env.SNAPCASE_SYNC_ENABLED == 'true'
        env:
          KEXIAOZHAN_REPORTING_USERNAME: ${{ secrets.KEXIAOZHAN_REPORTING_USERNAME }}
          KEXIAOZHAN_REPORTING_PASSWORD: ${{ secrets.KEXIAOZHAN_REPORTING_PASSWORD }}
          SNAPCASE_ACCOUNT_KEY: ${{ secrets.SNAPCASE_ACCOUNT_KEY }}
          REPORTING_ROW_HASH_SALT: ${{ secrets.REPORTING_ROW_HASH_SALT }}
          SNAPCASE_INGEST_URL: ${{ secrets.SNAPCASE_INGEST_URL }}
          REPORTING_INGEST_TOKEN: ${{ secrets.REPORTING_INGEST_TOKEN }}
          DATE_START: ${{ inputs.date_start || '' }}
          DATE_END: ${{ inputs.date_end || '' }}
        run: |
          node scripts/snapcase/backfill-snapcase.mjs \
            --live-provider \
            --ingest \
            --date-start "$DATE_START" \
            --date-end "$DATE_END" \
            --checkpoint "$RUNNER_TEMP/snapcase-backfill-checkpoint.local"
      - name: Reject live request while disabled
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.mode != 'fixture-dry-run' &&
          env.SNAPCASE_SYNC_ENABLED != 'true'
        run: |
          echo "SnapCase live ingest remains disabled."
          exit 1
