name: App and Content Validation

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/analytics/LeadAttributionManager.tsx'
      - 'src/components/layout/Footer.tsx'
      - 'src/components/resources/MobileOperatorEntry.tsx'
      - 'src/data/businessPlaybookPlanner.ts'
      - 'src/data/cateringDessertMenu.ts'
      - 'src/data/cateringDessertMenuContract.ts'
      - 'src/data/dessertAddOnComparison.ts'
      - 'src/data/dessertAddOnComparisonContract.ts'
      - 'src/data/mobileOperatorPages.ts'
      - 'src/data/mobileSetupFitChecker.ts'
      - 'src/data/mobileSetupFitContract.ts'
      - 'src/lib/analytics.ts'
      - 'src/lib/businessPlaybookAnalytics.ts'
      - 'src/lib/leadAttribution.ts'
      - 'src/lib/leadSubmissions.ts'
      - 'src/lib/machineNames.ts'
      - 'src/lib/quoteIntake.ts'
      - 'src/lib/reporting.ts'
      - 'src/lib/seoRoutes.ts'
      - 'src/lib/signedExportWindow.ts'
      - 'src/pages/Contact.tsx'
      - 'src/pages/Index.tsx'
      - 'src/pages/Products.tsx'
      - 'src/pages/Resources.tsx'
      - 'src/pages/admin/Machines.tsx'
      - 'src/pages/admin/Reporting.tsx'
      - 'src/pages/portal/Reports.tsx'
      - 'src/pages/products/CommercialRobotic.tsx'
      - 'src/pages/products/Micro.tsx'
      - 'src/pages/products/Mini.tsx'
      - 'src/pages/resources/BusinessPlaybookIndex.tsx'
      - 'src/pages/resources/BusinessPlaybookPaybackPlanner.tsx'
      - 'src/pages/resources/BusinessPlaybookPlanner.tsx'
      - 'src/pages/resources/FoodTruckCateringDessertMenu.tsx'
      - 'src/pages/resources/FoodTruckDessertAddOns.tsx'
      - 'src/pages/resources/MobileFoodSetupGuide.tsx'
      - 'src/pages/resources/MobileSetupFitChecker.tsx'
      - 'src/pages/solutions/FoodTrucks.tsx'
      - 'supabase/functions/_shared/lead-attribution.ts'
      - 'supabase/functions/_shared/lead-attribution.test.ts'
      - 'supabase/functions/_shared/sales-report-pdf.ts'
      - 'supabase/functions/lead-submission-intake/**'
      - 'supabase/functions/sales-report-export/**'
      - 'supabase/migrations/202608100002_lead_attribution.sql'
      - 'supabase/tests/lead_attribution_safety.sql'
      - 'scripts/validate-machines-workspace.mjs'
      - 'scripts/validate-lead-attribution.mjs'
      - 'scripts/validate-quote-intake.mjs'
      - 'scripts/validate-mobile-operator-pages.mjs'
      - 'scripts/validate-planner-context.mjs'
      - 'scripts/validate-mobile-fit-checker.mjs'
      - 'scripts/validate-dessert-add-on-comparison.mjs'
      - 'scripts/validate-catering-dessert-menu.mjs'
      - 'scripts/validate-sales-report-pdf-polish.mjs'
      - 'scripts/prerender-public-routes.mjs'
      - 'scripts/seo-regression-check.mjs'
      - 'scripts/refunds/validate-machine-manager-uat.mjs'
      - 'scripts/refunds/validate-refund-portal-uat.mjs'
      - 'Docs/DECISIONS.md'
      - 'Docs/LEAD_ATTRIBUTION.md'
      - 'Docs/QA_SMOKE_TEST_CHECKLIST.md'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/app-content-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.3
      - name: Install dependencies
        run: npm ci
      - name: Validate changed app and content contracts
        run: npm run test:app
